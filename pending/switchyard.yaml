# STAGED, NOT APPLIED. Image placeholder: no prebuilt Switchyard image is published (checked ghcr.io and Docker Hub); it must be built from
# https://github.com/NVIDIA-NeMo/Switchyard (Dockerfile at repo root, tag v0.3.0). ConfigMap switchyard-routes comes from switchyard-routes.toml.
apiVersion: apps/v1
kind: Deployment
metadata: {name: switchyard, namespace: ea-aigw}
spec:
  replicas: 1
  selector: {matchLabels: {app: switchyard}}
  template:
    metadata: {labels: {app: switchyard}}
    spec:
      containers:
      - name: switchyard
        image: IMAGE_TO_BE_BUILT/switchyard:0.3.0
        args: ["--config", "/etc/switchyard/routes.toml"]
        env:
        - {name: GATEWAY_KEY, valueFrom: {secretKeyRef: {name: a2a-agent-key, key: key}}}
        ports: [{containerPort: 4000}]
        volumeMounts: [{name: routes, mountPath: /etc/switchyard}]
      volumes: [{name: routes, configMap: {name: switchyard-routes}}]
---
apiVersion: v1
kind: Service
metadata: {name: switchyard, namespace: ea-aigw}
spec: {selector: {app: switchyard}, ports: [{name: http, port: 4000}]}
