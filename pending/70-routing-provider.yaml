# STAGED, NOT APPLIED: needs the Switchyard decision service (k8s/pending/switchyard.yaml) and KONG_UNTRUSTED_LUA=on on the DP.
# https://developer.konghq.com/ai-gateway/policies/ai-routing-provider/  (NVIDIA Switchyard AI Routing policy, streaming custom policy)
# Apply with: kongctl apply -f kong/00-gateway.yaml -f pending/70-routing-provider.yaml --mode apply
_defaults:
  kongctl:
    namespace: ea-automation

ai_gateway_custom_policies:
- ref: ai-routing-provider
  ai_gateway: ea-gw
  name: ai-routing-provider
  type: streaming
  display_name: "AI Routing Provider (NVIDIA Switchyard)"
  schema: !file ai-routing-provider.schema.lua
  handler: !file ai-routing-provider.handler.lua

ai_gateway_policies:
- ref: ea-routing
  ai_gateway: ea-gw
  name: ea-routing
  display_name: "EA routing: Switchyard picks Haiku or Sonnet per request (starts observe_only)"
  type: ai-routing-provider
  enabled: true
  global: false
  config:
    decision_api_url: http://switchyard.ea-aigw.svc.cluster.local:4000/v1/decision
    decision_route: switchyard/general
    inbound_profile: anthropic_messages
    inbound_endpoint: /v1/messages
    prompt_disclosure: none
    mode: observe_only            # flip to "enforce" once decisions look right (X-AI-Routing-Outcome: observed -> enforced)
    dispatch: konnect_model       # resolves targets against this gateway's own AI Model entities
    timeout_ms: 800
    default_target: fast
    targets:
      fast:   {model: ea-claude-agents,  protocol: anthropic_messages, provider: anthropic}
      strong: {model: ea-bedrock-claude, protocol: anthropic_messages, provider: bedrock}

ai_gateway_models:
- ref: ea-claude-route
  ai_gateway: ea-gw
  name: ea-claude-route
  display_name: "EA - Routed model (Switchyard decides)"
  type: model
  enabled: true
  formats: [{type: anthropic}]
  capabilities: ['*']
  labels: {owner: ea-poc, purpose: route}
  access: {auth_strategies: [key-auth]}
  policies: [ea-routing]
  config:
    route: {paths: [/route], protocols: [http, https], strip_path: true}
    model: {name_header: true}
    logging: {payloads: false}
  targets:
  - name: claude-haiku-4-5-20251001
    provider: kong-se-anthropic
    weight: 100
    config: {type: anthropic, version: "2023-06-01", input_cost: 1, output_cost: 5, cache_read_cost: 0.1, cache_write_cost: 1.25}
