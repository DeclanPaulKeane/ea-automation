# EA - Claude + custom policy -> POST https://ea-aigw.kong-sales-engineering.com/custom/v1/messages
_defaults:
  kongctl:
    namespace: ea-automation

ai_gateway_models:
- ref: ea-claude-custom
  ai_gateway: ea-gw
  name: ea-claude-custom
  display_name: "EA - Claude Haiku + custom policy"
  type: model
  enabled: true
  formats: [{type: anthropic}]
  capabilities: ['*']
  labels: {owner: ea-poc, purpose: custom}
  access: {auth_strategies: [key-auth]}
  policies: [ea-stamp-policy]
  config:
    route: {paths: [/custom], protocols: [http, https], strip_path: true}
    model: {name_header: true}
    logging: {payloads: false}
  targets:
  - name: claude-haiku-4-5-20251001
    provider: kong-se-anthropic
    weight: 100
    config: {type: anthropic, version: "2023-06-01", input_cost: 1, output_cost: 5, cache_read_cost: 0.1, cache_write_cost: 1.25}
