# EA - Azure OpenAI GPT-4o  ->  POST https://ea-aigw.kong-sales-engineering.com/azure/v1/messages
_defaults:
  kongctl:
    namespace: ea-automation

ai_gateway_models:
- ref: ea-azure-gpt4o
  ai_gateway: ea-gw
  name: ea-azure-gpt4o
  display_name: "EA - Azure OpenAI GPT-4o"
  type: model
  enabled: true
  formats: [{type: anthropic}]
  capabilities: ['*']
  labels: {owner: ea-poc, purpose: azure}
  access: {auth_strategies: [key-auth]}
  config:
    route: {paths: [/azure], protocols: [http, https], strip_path: true}
    model: {name_header: true}
    logging: {payloads: false}
  targets:
  - name: gpt-4o
    provider: ea-azure
    weight: 100
    config: {type: azure, deployment_id: gpt-4o, api_version: '2024-10-21', input_cost: 2.5, output_cost: 10}
