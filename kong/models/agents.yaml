# EA - Claude (agents) -> POST https://ea-aigw.kong-sales-engineering.com/agents/v1/messages  (the model the two A2A agents call through the gateway)
_defaults:
  kongctl:
    namespace: ea-automation

ai_gateway_models:
- ref: ea-claude-agents
  ai_gateway: ea-gw
  name: ea-claude-agents
  display_name: "EA - Claude Haiku (agents)"
  type: model
  enabled: true
  formats: [{type: anthropic}]
  capabilities: ['*']
  labels: {owner: ea-poc, purpose: agents}
  access: {auth_strategies: [key-auth]}
  config:
    route: {paths: [/agents], protocols: [http, https], strip_path: true}
    model: {name_header: true}
    logging: {payloads: false}
  targets:
  - name: claude-haiku-4-5-20251001
    provider: kong-se-anthropic
    weight: 100
    config: {type: anthropic, version: "2023-06-01", input_cost: 1, output_cost: 5, cache_read_cost: 0.1, cache_write_cost: 1.25}
