# Atlassian Rovo MCP (Jira, Confluence, Rovo Search) behind the gateway. Adapted from
# Kong-Demos/kong-ai-productivity-tool-packs/mcp-servers/atlassian (verified there on 2.1.0-rc.2; re-verified here on 2.3.0, see docs/05-mcp.md).
# The MCP client runs the OAuth dance against Atlassian (DCR, no app registration); Kong validates every token by RFC 7662 introspection and
# serves its OWN protected-resource document so strict clients (Insomnia, Claude Code, Cursor, VS Code) accept it.
_defaults:
  kongctl:
    namespace: ea-automation

ai_gateway_auth_strategies:
- ref: atlassian-oauth
  ai_gateway: ea-gw
  name: atlassian-oauth
  display_name: "Atlassian Rovo OAuth (introspection)"
  type: openid-connect
  config:
    introspection_endpoint: https://auth.atlassian.com/introspect     # load-bearing: selects the introspection branch (JWKS can never validate Atlassian tokens)
    cache_introspection: true
    # 2.3: the openid-connect plugin only introspects when it has a client identity (the 2.1 pack needed none). Atlassian's introspect ignores these values.
    client_id: [ea-gateway]
    client_secret: [!secret {source: !env INTROSPECT_CLIENT_SECRET}]
    introspection_endpoint_auth_method: client_secret_post
    issuer: https://auth.atlassian.com/.well-known/openid-configuration
    auth_methods: [bearer]
    hide_credentials: false          # the Atlassian upstream must still receive the token
    consumer_optional: true          # no Konnect consumer maps to an Atlassian subject
    consumer_groups_optional: true
    scopes: []
    cache_tokens_salt: !env ATLASSIAN_CACHE_SALT
    ssl_verify: true
    leeway: 30

ai_gateway_mcp_servers:
- ref: atlassian-rovo
  ai_gateway: ea-gw
  name: atlassian-rovo
  display_name: "Atlassian Rovo (Jira, Confluence, Rovo Search)"
  type: passthrough-listener
  enabled: true
  policies: []
  config:
    url: https://mcp.atlassian.com/v2/mcp         # must include /v2/mcp
    route:
      paths: [/atlassian]                          # keep in step with access.metadata.endpoint below
      strip_path: true
      protocols: [http, https]
      https_redirect_status_code: 426
      preserve_host: false
      regex_priority: 0
      request_buffering: true
      response_buffering: true
      headers: {}
    server: {forward_client_headers: true, timeout: 10000}
    max_request_body_size: 8388608
    logging: {audits: false, payloads: false}
  access:
    auth_strategies: [atlassian-oauth]
    acl_attribute_type: oauth_access_token
    access_token_claim_field: .sub
    metadata:
      resource: !env ATLASSIAN_PUBLIC_MCP_URL     # must equal the exact URL the client dials
      authorization_servers:
      - https://auth.atlassian.com/VCeDsk8ZHncYF1g234fKtc4lNipbBhu3
      endpoint: /.well-known/oauth-protected-resource/atlassian
      scopes_supported:
      - read:me
      - read:account
      - offline_access
      - read:jira:agent-interface
      - write:jira:agent-interface
      - search:jira:agent-interface
      - read:confluence:agent-interface
      - write:confluence:agent-interface
      - search:confluence:agent-interface
      - search:rovo:agent-interface
