# GitHub MCP (api.githubcopilot.com/mcp) behind the gateway, same pattern as Atlassian: the MCP client does the OAuth dance (here against the
# registered GitHub OAuth app "Konnect Github MCP"), Kong validates every token with the openid-connect auth strategy and forwards it upstream.
# GitHub tokens are opaque and GitHub has no RFC 7662 endpoint, so introspection goes to the in-cluster adapter (services/github-introspect).
_defaults:
  kongctl:
    namespace: ea-automation

ai_gateway_auth_strategies:
- ref: github-oauth
  ai_gateway: ea-gw
  name: github-oauth
  display_name: "GitHub OAuth (introspection via adapter)"
  type: openid-connect
  config:
    introspection_endpoint: http://github-introspect.ea-aigw.svc.cluster.local/introspect
    cache_introspection: true
    client_id: [!env GITHUB_CLIENT_ID]               # the OAuth app's public id; the plugin needs a client identity to introspect
    client_secret: [!secret {source: !env INTROSPECT_CLIENT_SECRET}]   # ignored by the adapter (it authenticates to GitHub with the real secret itself)
    introspection_endpoint_auth_method: client_secret_post
    issuer: http://github-introspect.ea-aigw.svc.cluster.local/.well-known/openid-configuration
    auth_methods: [bearer]
    hide_credentials: false          # the GitHub upstream must still receive the token
    consumer_optional: true
    consumer_groups_optional: true
    scopes: []
    cache_tokens_salt: !env ATLASSIAN_CACHE_SALT
    ssl_verify: true
    leeway: 30

ai_gateway_mcp_servers:
- ref: github
  ai_gateway: ea-gw
  name: github
  display_name: "GitHub MCP"
  type: passthrough-listener
  enabled: true
  policies: []
  config:
    url: https://api.githubcopilot.com/mcp/
    route:
      paths: [/github]                             # keep in step with access.metadata.endpoint below
      strip_path: true
      protocols: [http, https]
      https_redirect_status_code: 426
      preserve_host: false
      regex_priority: 0
      request_buffering: true
      response_buffering: true
      headers: {}
    server: {forward_client_headers: true, timeout: 30000}
    max_request_body_size: 8388608
    logging: {audits: false, payloads: false}
  access:
    auth_strategies: [github-oauth]
    acl_attribute_type: oauth_access_token
    access_token_claim_field: .username            # GitHub login from the introspection response
    metadata:
      resource: !env GITHUB_PUBLIC_MCP_URL
      authorization_servers: [https://github.com/login/oauth]
      endpoint: /.well-known/oauth-protected-resource/github
      scopes_supported: [repo, read:org, read:user, user:email]
