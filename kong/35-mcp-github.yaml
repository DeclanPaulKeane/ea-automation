# GitHub MCP (api.githubcopilot.com/mcp) behind the gateway as an OAuth PASSTHROUGH (same pattern as the Expeditors gateway).
# The MCP client (Insomnia) logs in to GitHub with the registered OAuth app "Konnect Github MCP" and sends the GitHub token; Kong forwards it
# and GitHub validates it upstream. Kong serves its OWN RFC 9728 protected-resource document and rewrites the upstream's 401 challenge so it
# points at Kong, which is what lets the client start OAuth against the gateway URL.
#
# Why not an OIDC auth strategy like Atlassian? On the 2.3 data plane an MCP route's bearer check is JWT signature verification only
# (introspection is never used and extra auth_methods are overridden to [bearer], warning AG103). GitHub OAuth tokens are opaque (gho_...), so
# they cannot pass. Atlassian tokens are JWTs, so Atlassian works with an OIDC strategy. Details: docs/05-mcp.md.
_defaults:
  kongctl:
    namespace: ea-automation

ai_gateway_policies:
- ref: github-mcp-oauth-metadata
  ai_gateway: ea-gw
  name: github-mcp-oauth-metadata
  display_name: "GitHub MCP: Kong-hosted RFC 9728 metadata and challenge rewrite"
  type: pre-function
  enabled: true
  global: false
  config:
    access:
    - |
      local path = kong.request.get_path()
      if path:find("/.well-known/oauth-protected-resource", 1, true) == 1 then
        local base = "https://" .. (kong.request.get_forwarded_host() or kong.request.get_host())
        return kong.response.exit(200, {
          resource = base .. "/github",
          authorization_servers = { "https://github.com/login/oauth" },
          scopes_supported = { "repo", "read:org", "read:user", "user:email" },
          bearer_methods_supported = { "header" },
          resource_name = "GitHub MCP via Kong (EA POC)",
        }, { ["Cache-Control"] = "no-cache" })
      end
    header_filter:
    - |
      local h = kong.response.get_header("WWW-Authenticate")
      if h then
        local base = "https://" .. (kong.request.get_forwarded_host() or kong.request.get_host())
        kong.response.set_header("WWW-Authenticate",
          (h:gsub('resource_metadata="[^"]*"', 'resource_metadata="' .. base .. '/.well-known/oauth-protected-resource/github"')))
      end

ai_gateway_mcp_servers:
- ref: github
  ai_gateway: ea-gw
  name: github
  display_name: "GitHub MCP (OAuth passthrough)"
  type: passthrough-listener
  enabled: true
  policies: [github-mcp-oauth-metadata]
  access: {acl_attribute_type: consumer}
  config:
    url: https://api.githubcopilot.com/mcp/
    route:
      paths: [/github, /.well-known/oauth-protected-resource/github]
      strip_path: true
      protocols: [http, https]
      https_redirect_status_code: 426
      preserve_host: false
      regex_priority: 0
      request_buffering: true
      response_buffering: true
      headers: {}
    server: {forward_client_headers: true, timeout: 30000}
    max_request_body_size: 8388608
    logging: {audits: false, payloads: false}
