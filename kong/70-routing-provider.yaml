# Needs the Switchyard decision service (k8s/40-switchyard.yaml) and KONG_UNTRUSTED_LUA=on on the DP (k8s/10-dp.yaml).
# Routing targets share /route with the entry model (distinguished by body "model" value): a model switched by the policy must live in the same route group.
# https://developer.konghq.com/ai-gateway/policies/ai-routing-provider/  (NVIDIA Switchyard AI Routing policy, streaming custom policy)
_defaults:
  kongctl:
    namespace: ea-automation

ai_gateway_custom_policies:
- ref: ai-routing-provider
  ai_gateway: ea-gw
  name: ai-routing-provider
  type: streaming
  display_name: "AI Routing Provider (NVIDIA Switchyard)"
  schema: !file lua/ai-routing-provider.schema.lua
  handler: !file lua/ai-routing-provider.handler.lua

ai_gateway_policies:
- ref: ea-routing
  ai_gateway: ea-gw
  name: ea-routing
  display_name: "EA routing: Switchyard picks Haiku or Sonnet per request (starts observe_only)"
  type: ai-routing-provider
  enabled: true
  global: false
  config:
    decision_api_url: http://switchyard.ea-aigw.svc.cluster.local:4000/v1/decision
    decision_route: switchyard/general
    inbound_profile: anthropic_messages
    inbound_endpoint: /v1/messages
    prompt_disclosure: none
    mode: enforce                 # observe_only logs decisions without applying them (outcome=observed); enforce routes for real (outcome=enforced)
    dispatch: konnect_model       # resolves targets against this gateway's own AI Model entities
    timeout_ms: 800
    default_target: fast
    targets:
      fast:   {model: ea-route-fast,   protocol: anthropic_messages, provider: anthropic}
      strong: {model: ea-route-strong, protocol: anthropic_messages, provider: bedrock}

ai_gateway_models:
- ref: ea-claude-route
  ai_gateway: ea-gw
  name: ea-claude-route
  display_name: "EA - Routed model (Switchyard decides)"
  type: model
  enabled: true
  formats: [{type: anthropic}]
  capabilities: ['*']
  labels: {owner: ea-poc, purpose: route}
  access: {auth_strategies: [key-auth]}
  policies: [ea-routing]
  config:
    route: {paths: [/route], protocols: [http, https], strip_path: true, model: {body_param: model, values: [ea-claude-route]}}
    model: {name_header: true}
    logging: {payloads: false}
  targets:
  - name: claude-haiku-4-5-20251001
    provider: kong-se-anthropic
    weight: 100
    config: {type: anthropic, version: "2023-06-01", input_cost: 1, output_cost: 5, cache_read_cost: 0.1, cache_write_cost: 1.25}
- ref: ea-route-fast
  ai_gateway: ea-gw
  name: ea-route-fast
  display_name: "EA - Routing target: fast (Claude Haiku)"
  type: model
  enabled: true
  formats: [{type: anthropic}]
  capabilities: ['*']
  labels: {owner: ea-poc, purpose: route-target}
  access: {auth_strategies: [key-auth]}
  config:
    route: {paths: [/route], protocols: [http, https], strip_path: true, model: {body_param: model, values: [ea-route-fast]}}
    model: {name_header: true}
    logging: {payloads: false}
  targets:
  - name: claude-haiku-4-5-20251001
    provider: kong-se-anthropic
    weight: 100
    config: {type: anthropic, version: "2023-06-01", input_cost: 1, output_cost: 5}
- ref: ea-route-strong
  ai_gateway: ea-gw
  name: ea-route-strong
  display_name: "EA - Routing target: strong (Claude Sonnet on Bedrock)"
  type: model
  enabled: true
  formats: [{type: anthropic}]
  capabilities: ['*']
  labels: {owner: ea-poc, purpose: route-target}
  access: {auth_strategies: [key-auth]}
  config:
    route: {paths: [/route], protocols: [http, https], strip_path: true, model: {body_param: model, values: [ea-route-strong]}}
    model: {name_header: true}
    logging: {payloads: false}
  targets:
  - name: us.anthropic.claude-sonnet-5-5
    provider: ea-bedrock
    weight: 100
    config: {type: bedrock, region: us-east-1, input_cost: 3, output_cost: 15}
