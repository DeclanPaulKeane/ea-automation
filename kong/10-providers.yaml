# Model providers. Credentials are write-only in Konnect: they come from the environment (local) or GitHub secrets (CI).
_defaults:
  kongctl:
    namespace: ea-automation

ai_gateway_model_providers:
- ref: ea-openai
  ai_gateway: ea-gw
  name: ea-openai
  display_name: "EA OpenAI"
  type: openai
  labels: {owner: ea-poc}
  config:
    auth: {type: basic, headers: [{name: Authorization, value: !secret {source: !env OPENAI_BEARER}}]}
- ref: ea-azure
  ai_gateway: ea-gw
  name: ea-azure
  display_name: "EA Azure OpenAI (se-openai-models)"
  type: azure
  labels: {owner: ea-poc}
  config:
    service: azure-openai
    instance: se-openai-models
    auth: {type: basic, headers: [{name: api-key, value: !secret {source: !env AZURE_KEY}}]}
- ref: ea-bedrock
  ai_gateway: ea-gw
  name: ea-bedrock
  display_name: "EA AWS Bedrock (assume role)"
  type: bedrock
  labels: {owner: ea-poc}
  config:
    auth:
      type: aws
      access_key_id: !env AWS_ACCESS_KEY_ID
      secret_access_key: !secret {source: !env AWS_SECRET_ACCESS_KEY}
      assume_role_arn: !env AWS_ASSUME_ROLE_ARM
      role_session_name: ea-aigw
