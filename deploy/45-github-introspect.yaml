# RFC 7662 introspection adapter for GitHub OAuth tokens (services/github-introspect/app.py). Cluster-internal only.
# ConfigMap github-introspect-app and Secret github-oauth are created by scripts/deploy-github-introspect.sh.
apiVersion: apps/v1
kind: Deployment
metadata: {name: github-introspect, namespace: ea-aigw}
spec:
  replicas: 1
  selector: {matchLabels: {app: github-introspect}}
  template:
    metadata: {labels: {app: github-introspect}}
    spec:
      containers:
      - name: app
        image: python:3.12-slim
        command: ["python", "-u", "/app/app.py"]
        envFrom: [{secretRef: {name: github-oauth}}]
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 2}
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: github-introspect-app}}]
---
apiVersion: v1
kind: Service
metadata: {name: github-introspect, namespace: ea-aigw}
spec: {selector: {app: github-introspect}, ports: [{name: http, port: 80, targetPort: 8080}]}
